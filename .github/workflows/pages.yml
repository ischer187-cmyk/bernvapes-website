name: Deploy to GitHub Pages

# GitHub Pages liefert den Branch "gh-pages" aus. Dieser Workflow spiegelt bei jedem Push
# den Stand von "main" dorthin — damit ist jeder Push auf main automatisch live.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: main → gh-pages
        run: git push --force origin HEAD:gh-pages
